services:
  - type: web
    name: tg-saas-backend
    env: node
    rootDir: tg-saas-backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tg-saas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: tg-saas-db
    databaseName: saas_db
    user: saas_user
    plan: free
